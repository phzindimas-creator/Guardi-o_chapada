name: Build Chapada Dragon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # 1. BAIXAR O PROJETO
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. INSTALAR DEPENDENCIAS
      # ========================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            python3-dev \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            openjdk-17-jdk

          python3 --version
          java -version


      # ========================================
      # 3. INSTALAR BUILDOZER
      # ========================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python3 -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

          buildozer --version


      # ========================================
      # 4. ENCONTRAR O PROJETO
      # ========================================

      - name: Find project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROCURANDO PROJETO"
          echo "========================================"

          SPEC="$(find . -type f -name 'buildozer.spec' ! -path './.git/*' -print -quit || true)"

          if [ -n "$SPEC" ]; then

            PROJECT_DIR="$(dirname "$SPEC")"

          else

            echo "buildozer.spec nao encontrado."

            ZIP="$(find . -type f -iname '*.zip' ! -path './.git/*' -print -quit || true)"

            if [ -z "$ZIP" ]; then
              echo "ERRO: nenhum projeto ou ZIP foi encontrado."
              exit 1
            fi

            echo "ZIP encontrado:"
            echo "$ZIP"

            rm -rf projeto
            mkdir -p projeto

            unzip -o "$ZIP" -d projeto

            SPEC="$(find projeto -type f -name 'buildozer.spec' -print -quit || true)"

            if [ -n "$SPEC" ]; then

              PROJECT_DIR="$(dirname "$SPEC")"

            else

              MAIN="$(find projeto -type f -name 'main.py' -print -quit || true)"

              if [ -z "$MAIN" ]; then
                echo "ERRO: main.py nao encontrado."
                exit 1
              fi

              PROJECT_DIR="$(dirname "$MAIN")"

            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: pasta do projeto nao encontrada."
            exit 1
          fi

          echo "========================================"
          echo "PROJETO ENCONTRADO"
          echo "========================================"

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ========================================
      # 5. CRIAR BUILDOZER.SPEC
      # ========================================

      - name: Create buildozer spec
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -f buildozer.spec

          printf '%s\n' \
            '[app]' \
            'title = Chapada Dragon' \
            'package.name = chapadadragon' \
            'package.domain = org.chapadadragon' \
            'source.dir = .' \
            'source.include_exts = py,png,jpg,jpeg,kv,atlas,wav,ogg,mp3,ttf,obj,mtl' \
            'version = 0.1.0' \
            'requirements = python3==3.12.10,pygame-ce,sdl2_image,sdl2_mixer,sdl2_ttf' \
            'orientation = landscape' \
            'fullscreen = 0' \
            'android.archs
