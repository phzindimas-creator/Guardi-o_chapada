name: Build Chapada Dragon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # 1. BAIXAR O PROJETO
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. INSTALAR DEPENDENCIAS
      # ========================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            python3-dev \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            openjdk-17-jdk

          echo "========================================"
          echo "DEPENDENCIAS INSTALADAS"
          echo "========================================"

          python3 --version
          pip3 --version
          java -version


      # ========================================
      # 3. INSTALAR BUILDOZER
      # ========================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip setuptools wheel

          python3 -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

          echo "========================================"
          echo "BUILDOZER INSTALADO"
          echo "========================================"

          buildozer --version


      # ========================================
      # 4. ENCONTRAR O PROJETO
      # ========================================

      - name: Find project
        shell: bash
        run: |
          set -e

          SPEC=$(find . \
            -type f \
            -name "buildozer.spec" \
            ! -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$SPEC" ]; then

            PROJECT_DIR=$(dirname "$SPEC")

          else

            ZIP=$(find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -n 1 || true)

            if [ -z "$ZIP" ]; then
              echo "ERRO: projeto ou ZIP nao encontrado."
              exit 1
            fi

            mkdir -p projeto

            unzip -o "$ZIP" -d projeto

            SPEC=$(find projeto \
              -type f \
              -name "buildozer.spec" \
              | head -n
