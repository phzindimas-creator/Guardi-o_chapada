name: Build Chapada Dragon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer==1.6.0 cython==0.29.37

      - name: Extrair projeto antigo
        shell: bash
        run: |
          set -e

          mkdir -p projeto

          ZIP_FILE=$(find . \
            -maxdepth 4 \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado:"
            echo "$ZIP_FILE"
            unzip -o "$ZIP_FILE" -d projeto
          else
            echo "Nenhum ZIP encontrado."
            cp -R . projeto/
            rm -rf projeto/.git
          fi

      - name: Encontrar projeto
        shell: bash
        run: |
          set -e

          SPEC=$(find projeto \
            -type f \
            -name "buildozer.spec" \
            | head -n 1 || true)

          if [ -z "$SPEC" ]; then
            echo "ERRO: buildozer.spec nao encontrado."
            find projeto -maxdepth 6 -type f | head -n 300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

      - name: Criar recipe pygame-ce
        shell: bash
        run: |
          set -e

          RECIPE_DIR="$PROJECT_DIR/p4a-recipes/pygame-ce"

          mkdir -p "$RECIPE_DIR"

          cat > "$RECIPE_DIR/__init__.py" <<'PYTHON'
          from pythonforandroid.recipe import CompiledComponentsPythonRecipe


          class PygameCeRecipe(CompiledComponentsPythonRecipe):
              version = "2.4.0"

              url = (
                  "https://github.com/pygame-community/"
                  "pygame-ce/archive/{version}.tar.gz"
              )

              site_packages_name = "pygame-ce"
              name = "pygame-ce"

              depends = [
                  "sdl2",
                  "sdl2_image",
                  "sdl2_mixer",
                  "sdl2_ttf",
                  "setuptools",
                  "jpeg",
                  "png",
              ]

              call_hostpython_via_targetpython = False


          recipe = PygameCeRecipe()
          PYTHON

          echo "Recipe pygame-ce criada."

      - name: Corrigir buildozer.spec
        shell: bash
        run: |
          set -e

          python3 - "$SPEC" "$PROJECT_DIR" <<'PYTHON'
          from pathlib import Path
          import sys

          spec = Path(sys.argv[1])
          project = Path(sys.argv[2]).resolve()

          text = spec.read_text(
              encoding="utf-8",
              errors="replace"
          )

          lines = text.splitlines()

          if not any(line.strip() == "[app]" for line in lines):
              lines.insert(0, "[app]")


          def set_option(name, value):
              global lines

              section = None

              for i, line in enumerate(lines):
                  stripped = line.strip()

                  if stripped.startswith("[") and stripped.endswith("]"):
                      section = stripped.lower()
                      continue

                  if (
                      section == "[app]"
                      and stripped.startswith(name + " =")
                  ):
                      lines[i] = f"{name} = {value}"
                      return

              for i, line in enumerate(lines):
                  if line.strip() == "[app]":
                      lines.insert(
                          i + 1,
                          f"{name} = {value}"
                      )
                      return


          set_option("title", "Chapada Dragon")
          set_option("package.name", "chapadadragon")
          set_option("package.domain", "org.chapadadragon")
          set_option("source.dir", project)
          set_option("version", "0.1.0")
          set_option("requirements", "python3,pygame-ce")

          set_option(
              "source.include_exts",
              "py,png,jpg,jpeg,kv,atlas,wav,ogg,mp3,ttf"
          )

          set_option(
              "android.archs",
              "arm64-v8a"
          )

          set_option(
              "android.accept_sdk_license",
              "True"
          )

          recipe_dir = (
              project / "p4a-recipes"
          ).resolve()

          set_option(
              "p4a.local_recipes",
              recipe_dir
          )

          set_option(
              "p4a.bootstrap",
              "sdl2"
          )


          new_lines = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("android.arch ="):
                  continue

              if stripped.startswith("android.sdk ="):
                  continue

              if stripped.startswith("android.ndk ="):
                  continue

              if stripped.startswith("android.ndk_api ="):
                  continue

              new_lines.append(line)

          lines = new_lines

          spec.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(
              spec.read_text(
                  encoding="utf-8"
              )
          )
          PYTHON

      - name: Limpar ambiente
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .buildozer
          rm -rf bin

          echo "Ambiente limpo
