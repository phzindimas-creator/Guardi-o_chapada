name: Build Chapada Dragon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ========================================
      # 1. BAIXAR O PROJETO
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # 2. INSTALAR DEPENDENCIAS
      # ========================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            python3.12 \
            python3.12-venv \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            openjdk-17-jdk


      # ========================================
      # 3. INSTALAR BUILDOZER
      # ========================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip setuptools wheel

          python3 -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ========================================
      # 4. ENCONTRAR O PROJETO
      # ========================================

      - name: Find project
        shell: bash
        run: |
          set -e

          SPEC=$(find . \
            -type f \
            -name "buildozer.spec" \
            ! -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$SPEC" ]; then
            PROJECT_DIR=$(dirname "$SPEC")
          else

            ZIP=$(find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -n 1 || true)

            if [ -z "$ZIP" ]; then
              echo "ERRO: projeto ou ZIP nao encontrado."
              exit 1
            fi

            mkdir -p projeto

            unzip -o "$ZIP" -d projeto

            SPEC=$(find projeto \
              -type f \
              -name "buildozer.spec" \
              | head -n 1 || true)

            if [ -n "$SPEC" ]; then
              PROJECT_DIR=$(dirname "$SPEC")
            else
              PROJECT_DIR=$(find projeto \
                -type f \
                -name "main.py" \
                -exec dirname {} \; \
                | head -n 1 || true)
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: pasta do projeto nao encontrada."
            exit 1
          fi

          echo "========================================"
          echo "PROJETO ENCONTRADO"
          echo "========================================"

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ========================================
      # 5. CRIAR BUILDOZER.SPEC
      # ========================================

      - name: Create buildozer spec
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -f buildozer.spec

          printf '%s\n' \
            '[app]' \
            'title = Chapada Dragon' \
            'package.name = chapadadragon' \
            'package.domain = org.chapadadragon' \
            'source.dir = .' \
            'source.include_exts = py,png,jpg,jpeg,kv,atlas,wav,ogg,mp3,ttf,obj,mtl' \
            'version = 0.1.0' \
            'requirements = python3==3.12.10,pygame-ce,sdl2_image,sdl2_mixer,sdl2_ttf' \
            'orientation = landscape' \
            'fullscreen = 0' \
            'android.archs = arm64-v8a' \
            'android.api = 35' \
            'android.minapi = 24' \
            'android.accept_sdk_license = True' \
            'p4a.bootstrap = sdl2' \
            'p4a.branch = master' \
            'p4a.local_recipes = p4a-recipes' \
            '' \
            '[buildozer]' \
            'log_level = 2' \
            'warn_on_root = 1' \
            > buildozer.spec

          echo "========================================"
          echo "BUILDOZER.SPEC CRIADO"
          echo "========================================"

          cat buildozer.spec


      # ========================================
      # 6. RECEITA PYGAME-CE
      # ========================================

      - name: Create pygame-ce recipe
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf p4a-recipes

          mkdir -p p4a-recipes/pygame-ce

          cat > p4a-recipes/pygame-ce/__init__.py <<'PYRECIPE'
          from os.path import join

          from pythonforandroid.recipe import CompiledComponentsPythonRecipe
          from pythonforandroid.toolchain import current_directory


          class Pygame2Recipe(CompiledComponentsPythonRecipe):

              version = "2.4.0"

              url = (
                  "https://github.com/pygame-community/"
                  "pygame-ce/archive/{version}.tar.gz"
              )

              site_packages_name = "pygame-ce"

              name = "pygame-ce"

              depends = [
                  "sdl2",
                  "sdl2_image",
                  "sdl2_mixer",
                  "sdl2_ttf",
                  "setuptools",
                  "jpeg",
                  "png",
              ]

              call_hostpython_via_targetpython = False

              install_in_hostpython = False


              def prebuild_arch(self, arch):

                  super().prebuild_arch(arch)

                  with current_directory(
                      self.get_build_dir(arch.arch)
                  ):

                      setup_template = open(
                          join(
                              "buildconfig",
                              "Setup.Android.SDL2.in"
                          )
                      ).read()

                      env = self.get_recipe_env(arch)

                      env["ANDROID_ROOT
