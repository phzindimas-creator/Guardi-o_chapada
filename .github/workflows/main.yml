name: Compilar APK com Buildozer 🐍📱

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ Instalar dependências e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev libssl-dev libffi-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: ⚙️ Aceitar Licenças e Compilar APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer -v android debug

      - name: 📦 Salvar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
