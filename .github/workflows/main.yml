name: Build Chapada Dragon APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            python3-dev \
            git \
            zip \
            unzip \
            curl \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            openjdk-17-jdk

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip setuptools wheel

          python3 -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      - name: Find project
        shell: bash
        run: |
          set -e

          SPEC="$(find . -type f -name 'buildozer.spec' -not -path './.git/*' -print -quit || true)"

          if [ -n "$SPEC" ]; then
            PROJECT_DIR="$(dirname "$SPEC")"
          else
            ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERRO: projeto ou arquivo ZIP não encontrado."
              exit 1
            fi

            rm -rf projeto
            mkdir -p projeto

            unzip -o "$ZIP_FILE" -d projeto

            SPEC="$(find projeto -type f -name 'buildozer.spec' -print -quit || true)"

            if [ -n "$SPEC" ]; then
              PROJECT_DIR="$(dirname "$SPEC")"
            else
              MAIN_FILE="$(find projeto -type f -name 'main.py' -print -quit || true)"

              if [ -z "$MAIN_FILE" ]; then
                echo "ERRO: main.py não encontrado."
                exit 1
              fi

              PROJECT_DIR="$(dirname "$MAIN_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: pasta do projeto não encontrada."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create buildozer spec
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -f buildozer.spec

          cat > buildozer.spec <<'SPECFILE'
          [app]
          title = Chapada Dragon
          package.name = chapadadragon
          package.domain = org.chapadadragon
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,wav,ogg,mp3,ttf,obj,mtl
          version = 0.1.0
          requirements = python3,pygame-ce,sdl2_image,sdl2_mixer,sdl2_ttf
          orientation = landscape
          fullscreen = 0
          android.archs = arm64-v8a
          android.api = 35
          android.minapi = 24
          android.accept_sdk_license = True
          p4a.bootstrap = sdl2
          p4a.branch = master
          p4a.local_recipes = p4a-recipes

          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPECFILE

          echo "buildozer.spec criado."

      - name: Create pygame-ce recipe
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf p4a-recipes
          mkdir -p p4a-recipes/pygame-ce

          curl -fL \
            "https://raw.githubusercontent.com/kivy/python-for-android/a54e9af8dcb5616f361c74cd2fbc5cb4c7ae952b/pythonforandroid/recipes/pygame-ce/__init__.py" \
            -o p4a-recipes/pygame-ce/__init__.py

          test -s p4a-recipes/pygame-ce/__init__.py

          echo "Receita pygame-ce criada."

      - name: Initialize Buildozer
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          buildozer android p4a -- --help || true

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$HOME/.buildozer" -type f -name 'sdkmanager' -print -quit || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "Aceitando licenças Android..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          echo "Instalando componentes Android..."

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35"

          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/35.0.0/aidl"

          echo "Android SDK preparado."

      - name: Accept Android licenses again
        shell: bash
        run: |
          set -e

          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$(find "$HOME/.buildozer" -type f -name 'sdkmanager' -print -quit || true)"

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" \
              --sdk_root="$SDK_ROOT" \
              --licenses || true
          fi

          echo "Licenças verificadas."

      - name: Clean old build
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          rm -rf bin
          echo "Build antigo removido."

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          set +e

          buildozer -v android debug > build.log 2>&1

          STATUS=$?

          echo "========================================"
          echo "ERROS IMPORTANTES"
          echo "========================================"

          grep -nEi \
            "error:|fatal error|failed|exception|traceback|command failed|license|aidl" \
            build.log \
            | tail -n 200 || true

          echo "========================================"
          echo "FINAL DO LOG"
          echo "========================================"

          tail -n 250 build.log

          echo "Código final: $STATUS"

          exit "$STATUS"

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Chapada-Dragon-Build-Log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Find APK
        if: ${{ success() }}
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR/bin" -type f -name '*.apk' -print -quit || true)"

          if [ -z "$APK_FILE" ]; then
            echo "APK não encontrado em bin. Procurando no projeto inteiro."

            APK_FILE="$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -not -path '*/.git/*' -print -quit || true)"
          fi

          if [ -z "$APK_FILE" ]; then
            echo "ERRO: nenhum APK foi encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/Chapada-Dragon.apk"

          ls -lh "$GITHUB_WORKSPACE/apk-output/Chapada-Dragon.apk"

      - name: Upload APK for download
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Chapada-Dragon-APK
          path: ${{ github.workspace }}/apk-output/Chapada-Dragon.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
