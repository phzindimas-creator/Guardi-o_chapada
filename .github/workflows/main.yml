name: Build Chapada Dragon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk

      - name: Install Buildozer
        shell: bash
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer==1.6.0 cython==0.29.37

      - name: Find project
        shell: bash
        run: |
          set -e

          SPEC=$(find . -type f -name "buildozer.spec" ! -path "./.git/*" | head -n 1 || true)

          if [ -n "$SPEC" ]; then
            PROJECT_DIR=$(dirname "$SPEC")
          else
            ZIP=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1 || true)

            if [ -z "$ZIP" ]; then
              echo "ERRO: projeto ou ZIP nao encontrado."
              exit 1
            fi

            mkdir -p projeto
            unzip -o "$ZIP" -d projeto

            SPEC=$(find projeto -type f -name "buildozer.spec" | head -n 1 || true)

            if [ -n "$SPEC" ]; then
              PROJECT_DIR=$(dirname "$SPEC")
            else
              PROJECT_DIR=$(find projeto -type f -name "main.py" -exec dirname {} \; | head -n 1 || true)
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: pasta do projeto nao encontrada."
            exit 1
          fi

          echo "Projeto encontrado:"
