name: Build Chapada Dragon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv git zip unzip autoconf automake libtool pkg-config libltdl-dev libffi-dev libssl-dev zlib1g-dev openjdk-17-jdk

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer==1.6.0 cython==0.29.37

      - name: Find project
        shell: bash
        run: |
          SPEC=$(find . -type f -name "buildozer.spec" ! -path "./.git/*" | head -n 1 || true)

          if [ -z "$SPEC" ]; then
            ZIP=$(find . -type f -iname "*.zip" ! -path "./.git/*" | head -n 1 || true)

            if [ -z "$ZIP" ]; then
              echo "ERRO: buildozer.spec e ZIP nao encontrados."
              exit 1
            fi

            mkdir -p projeto
            unzip -o "$ZIP" -d projeto

            SPEC=$(find projeto -type f -name "buildozer.spec" | head -n 1 || true)
          fi

          if [ -z "$SPEC" ]; then
            echo "ERRO: buildozer.spec nao encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto:"
          echo "$PROJECT_DIR"

      - name: Configure buildozer
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          sed -i '/^title[ ]*=/d' buildozer.spec
          sed -i '/^package.name[ ]*=/d' buildozer.spec
          sed -i '/^package.domain[ ]*=/d' buildozer.spec
          sed -i '/^source.dir[ ]*=/d' buildozer.spec
          sed -i '/^version[ ]*=/d' buildozer.spec
          sed -i '/^requirements[ ]*=/d' buildozer.spec
          sed -i '/^source.include_exts[ ]*=/d' buildozer.spec
          sed -i '/^android.arch[ ]*=/d' buildozer.spec
          sed -i '/^android.archs[ ]*=/d' buildozer.spec
          sed -i '/^android.api[ ]*=/d' buildozer.spec
          sed -i '/^android.minapi[ ]*=/d' buildozer.spec
          sed -i '/^android.accept_sdk_license[ ]*=/d' buildozer.spec
          sed -i '/^p4a.local_recipes[ ]*=/d' buildozer.spec
          sed -i '/^p4a.bootstrap[ ]*=/d' buildozer.spec

          printf '%s\n' \
            'title = Chapada Dragon' \
            'package.name = chapadadragon' \
            'package.domain = org.chapadadragon' \
            'source.dir = .' \
            'version = 0.1.0' \
            'requirements = python3,pygame-ce' \
            'source.include_exts = py,png,jpg,jpeg,kv,atlas,wav,ogg,mp3,ttf' \
            'android.archs = arm64-v8a' \
            'android.api = 35' \
            'android.minapi = 24' \
            'android.accept_sdk_license = True' \
            'p4a.local_recipes = p4a-recipes' \
            'p4a.bootstrap = sdl2' >> buildozer.spec

          mkdir -p p4a-recipes/pygame-ce

          printf '%s\n' \
            'from pythonforandroid.recipe import CompiledComponentsPythonRecipe' \
            '' \
            'class PygameCeRecipe(CompiledComponentsPythonRecipe):' \
            '    version = "2.4.0"' \
            '    url = "https://github.com/pygame-community/pygame-ce/archive/{version}.tar.gz"' \
            '    site_packages_name = "pygame"' \
            '    depends = ["sdl2", "sdl2_image", "sdl2_mixer", "sdl2_ttf", "setuptools", "jpeg", "png"]' \
            '' \
            'recipe = PygameCeRecipe()' \
            > p4a-recipes/pygame-ce/__init__.py

          echo "buildozer.spec configurado."

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          export ANDROIDSDK="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"

          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"

          buildozer android p4a -- --help || true

          SDKMANAGER=$(find "$HOME/.buildozer" -type f -name "sdkmanager" | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;37.0.0" \
            "platforms;android-35"

          test -x "$SDK_ROOT/build-tools/37.0.0/aapt"
          test -x "$SDK_ROOT/build-tools/37.0.0/aidl"

          echo "Android SDK OK."

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          rm -rf bin

          set +e

          buildozer -v android debug > build.log 2>&1

          STATUS=$?

          echo "=============================="
          echo "ERROS"
          echo "=============================="

          grep -nEi "error:|fatal error|failed|exception|traceback|command failed|license|aidl" build.log | tail -n 150 || true

          echo "=============================="
          echo "FINAL DO LOG"
          echo "=============================="

          tail -n 200 build.log

          echo "CODIGO FINAL: $STATUS"

          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chapada-Dragon-Build-Log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: warn

      - name: Find APK
        if: success()
        run: |
          find "$PROJECT_DIR/bin" -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Chapada-Dragon-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
