name: Build Chapada Dragon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk

      - name: Instalar Buildozer
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip setuptools wheel

          python3 -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

      - name: Encontrar projeto
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROCURANDO PROJETO"
          echo "========================================"

          SPEC=$(find . \
            -type f \
            -name "buildozer.spec" \
            ! -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$SPEC" ]; then

            echo "buildozer.spec nao encontrado na raiz."

            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERRO: nenhum ZIP encontrado."
              exit 1
            fi

            echo "ZIP encontrado:"
            echo "$ZIP_FILE"

            mkdir -p projeto

            unzip -o "$ZIP_FILE" -d projeto

            SPEC=$(find projeto \
              -type f \
              -name "buildozer.spec" \
              | head -n 1 || true)

          fi

          if [ -z "$SPEC" ]; then
            echo "ERRO: buildozer.spec nao encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto:"
          echo "$PROJECT_DIR"

      - name: Preparar pygame-ce
        shell: bash
        run: |
          set -e

          mkdir -p "$PROJECT_DIR/p4a-recipes/pygame-ce"

          printf '%s\n' \
          'from pythonforandroid.recipe import CompiledComponentsPythonRecipe' \
          '' \
          'class PygameCeRecipe(CompiledComponentsPythonRecipe):' \
          '    version = "2.4.0"' \
          '    url = "https://github.com/pygame-community/pygame-ce/archive/{version}.tar.gz"' \
          '    site_packages_name = "pygame-ce"' \
          '    name = "pygame-ce"' \
          '    depends = ["sdl2", "sdl2_image", "sdl2_mixer", "sdl2_ttf", "setuptools", "jpeg", "png"]' \
          '    call_hostpython_via_targetpython = False' \
          '' \
          'recipe = PygameCeRecipe()' \
          > "$PROJECT_DIR/p4a-recipes/pygame-ce/__init__.py"

          echo "pygame-ce preparado."

      - name: Corrigir buildozer spec
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          sed -i '/^[[:space:]]*android\.arch[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.sdk[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.ndk[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.ndk_api[[:space:]]*=/d' buildozer.spec

          sed -i '/^requirements[[:space:]]*=/d' buildozer.spec
          sed -i '/^source.include_exts[[:space:]]*=/d' buildozer.spec
          sed -i '/^android.archs[[:space:]]*=/d' buildozer.spec
          sed -i '/^android.accept_sdk_license[[:space:]]*=/d' buildozer.spec
          sed -i '/^p4a.local_recipes[[:space:]]*=/d' buildozer.spec
          sed -i '/^p4a.bootstrap[[:space:]]*=/d' buildozer.spec

          if ! grep -q '^title[[:space:]]*=' buildozer.spec; then
            sed -i '/^\[app\]/a title = Chapada Dragon' buildozer.spec
          fi

          if ! grep -q '^package.name[[:space:]]*=' buildozer.spec; then
            sed -i '/^\[app\]/a package.name = chapadadragon' buildozer.spec
          fi

          if ! grep -q '^package.domain[[:space:]]*=' buildozer.spec; then
            sed -i '/^\[app\]/a package.domain = org.chapadadragon' buildozer.spec
          fi

          if ! grep -q '^version[[:space:]]*=' buildozer.spec; then
            sed -i '/^\[app\]/a version = 0.1.0' buildozer.spec
          fi

          if ! grep -q '^source.dir[[:space:]]*=' buildozer.spec; then
            sed -i '/^\[app\]/a source.dir = .' buildozer.spec
          fi

          printf '%s\n' \
          'requirements = python3,pygame-ce' \
          'source.include_exts = py,png,jpg,jpeg,kv,atlas,wav,ogg,mp3,ttf' \
          'android.archs = arm64-v8a' \
          'android.accept_sdk_license = True' \
          'p4a.local_recipes = p4a-recipes' \
          'p4a.bootstrap = sdl2' \
          >> buildozer.spec

          echo "buildozer.spec corrigido."

      - name: Preparar Android SDK
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PREPARANDO ANDROID SDK"
          echo "========================================"

          buildozer android p4a -- --help > sdk-setup.log 2>&1

          echo "Buildozer terminou a preparacao inicial."

          SDKMANAGER=$(find "$HOME/.buildozer" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado."

            find "$HOME/.buildozer" \
              -type f \
              -name "sdkmanager*" \
              | head -n 50

            exit 1
          fi

          echo "sdkmanager encontrado:"
          echo "$SDKMANAGER"

          SDK_DIR=$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")

          echo "ANDROID SDK:"
          echo "$SDK_DIR"

          export ANDROIDSDK="$SDK_DIR"
          export ANDROID_HOME="$SDK_DIR"

          echo "ANDROIDSDK=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ACEITANDO LICENCAS"
          echo "========================================"

          yes | "$SDKMANAGER" --licenses || true

          echo "========================================"
          echo "INSTALANDO BUILD TOOLS"
          echo "========================================"

          "$SDKMANAGER" \
            "platform-tools" \
            "build-tools;37.0.0" \
            "platforms;android-36"

          echo "========================================"
          echo "SDK PRONTO"
          echo "========================================"

      - name: Preparar ambiente
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .buildozer/android/platform/build-arm64-v8a

          rm -rf bin

          echo "Ambiente preparado."

      - name: Compilar APK
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CHAPADA DRAGON"
          echo "COMPILANDO APK"
          echo "========================================"

          buildozer -v android debug > build.log 2>&1

          STATUS=$?

          echo ""
          echo "========================================"
          echo "ERROS"
          echo "========================================"

          grep -nEi \
            "error:|fatal error|failed|exception|traceback|command failed|license|aidl" \
            build.log \
            | tail -n 120 || true

          echo ""
          echo "========================================"
          echo "ULTIMAS 150 LINHAS"
          echo "========================================"

          tail -n 150 build.log

          echo ""
          echo "CODIGO FINAL: $STATUS"

          exit $STATUS

      - name: Salvar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chapada-Dragon-Build-Log
          path: |
            ${{ env.PROJECT_DIR }}/build.log
            ${{ env.PROJECT_DIR }}/sdk-setup.log
          if-no-files-found: warn

      - name: Procurar APK
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "PROCURANDO APK"
          echo "========================================"

          find "$PROJECT_DIR/bin" \
            -type f \
            -name "*.apk" \
            -print

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Chapada-Dragon-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
